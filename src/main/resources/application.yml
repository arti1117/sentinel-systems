spring:
  application:
    name: sentinel-systems
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${SENTINEL_JDBC_URL:jdbc:postgresql://localhost:5432/sentinel}
    username: ${SENTINEL_DB_USER:sentinel}
    password: ${SENTINEL_DB_PASSWORD:sentinel}
    driver-class-name: org.postgresql.Driver
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.spatial.dialect.postgis.PostgisPG10Dialect
  data:
    redis:
      host: ${SENTINEL_REDIS_HOST:localhost}
      port: ${SENTINEL_REDIS_PORT:6379}

sentinel:
  ingestion:
    api-timeout-ms: ${SENTINEL_API_TIMEOUT_MS:3000}
    traffic-stale-seconds: ${SENTINEL_TRAFFIC_STALE_SECONDS:300}
    weather-stale-seconds: ${SENTINEL_WEATHER_STALE_SECONDS:900}
