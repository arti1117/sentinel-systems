services:
  postgres-postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: sentinel-postgis
    restart: unless-stopped
    mem_limit: 512m
    environment:
      POSTGRES_DB: ${SENTINEL_DB_NAME:-sentinel}
      POSTGRES_USER: ${SENTINEL_DB_USER:-sentinel}
      POSTGRES_PASSWORD: ${SENTINEL_DB_PASSWORD:-sentinel}
    ports:
      - "${SENTINEL_DB_PORT:-5432}:5432"
    volumes:
      - postgis-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${SENTINEL_DB_USER:-sentinel} -d ${SENTINEL_DB_NAME:-sentinel}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7.4-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    mem_limit: 256m
    ports:
      - "${SENTINEL_REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: sentinel-backend
    restart: unless-stopped
    mem_limit: 512m
    env_file:
      - path: .env
        required: false
    environment:
      JAVA_TOOL_OPTIONS: "-XX:+UseSerialGC -Xmx384m"
      SENTINEL_JDBC_URL: jdbc:postgresql://postgres-postgis:5432/sentinel
      SENTINEL_DB_USER: ${SENTINEL_DB_USER:-sentinel}
      SENTINEL_DB_PASSWORD: ${SENTINEL_DB_PASSWORD:-sentinel}
      SENTINEL_REDIS_HOST: redis
      SENTINEL_REDIS_PORT: 6379
    ports:
      - "8080:8080"
    depends_on:
      postgres-postgis:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sentinel-frontend
    restart: unless-stopped
    mem_limit: 128m
    ports:
      - "5173:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:80/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgis-data:
  redis-data:
