services:
  postgres-postgis:
    image: postgis/postgis:16-3.4-alpine
    container_name: sentinel-postgis
    restart: unless-stopped
    environment:
      POSTGRES_DB: sentinel
      POSTGRES_USER: sentinel
      POSTGRES_PASSWORD: ${SENTINEL_DB_PASSWORD:-sentinel_local_pw}
      TZ: Asia/Seoul
    ports:
      - "5432:5432"
    volumes:
      - sentinel_pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7.4-alpine
    container_name: sentinel-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - sentinel_redisdata:/data

volumes:
  sentinel_pgdata:
  sentinel_redisdata:
